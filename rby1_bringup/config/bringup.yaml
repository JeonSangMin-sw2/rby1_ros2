# rby1_bringup/launch/bringup.launch.py: what each part starts with. One section per launch file
# it includes, with that launch file's arguments; an empty value ("") means that launch file's
# default. Which sections start is chosen on the command line (driver:=true, camera:=true, ...).
#
#   ros2 launch rby1_bringup bringup.launch.py moveit_executor:=true gripper:=true
#   ros2 launch rby1_bringup bringup.launch.py config:=/path/to/my_bringup.yaml camera:=true

driver:                       # rby1_driver/launch/rby1_ros2_driver.launch.py
  params_file: ""             # driver parameters YAML; "": rby1_driver/config/driver_parameters.yaml
  namespace: rby1             # namespace of the driver and of everything that talks to it
  robot_ip: ""                # robot address and gRPC port; "": the params file's
  model: ""                   # a or m; "": the params file's

moveit_executor:              # rby1_moveit_executor/launch/moveit_executor.launch.py (the MoveIt planner;
  rviz: true                  # takes the robot to the ready pose). Not together with moveit_demo.
  velocity_scaling: 0.5       # MoveIt velocity scaling (0..1]
  minimum_time: 2.0           # a move takes at least this many seconds
  impedance: false            # follow trajectories in joint impedance (compliant arm)
  ready_pose: ""              # ready pose YAML; "": its config/ready_pose.yaml
  version: ""                 # robot version such as 1.2; "": read from the driver. Write 1.3 for an RB-Y1 v1.3:
                              # its gripper is in the robot model, so GRIPPER feeds the finger joints and gripper.yaml is refused

moveit_demo:                  # rby1_moveit_<model>_<version>/launch/demo.launch.py (MoveIt with ros2_control)
  package: rby1_moveit_m_1_2  # rby1_moveit_{a,m}_{1_0,1_1,1_2,1_3}
  use_fake_hardware: false

ros2_control:                 # rby1_hardware/launch/rby1_hardware.launch.py (ros2_control without MoveIt). Which robot
  use_fake_hardware: false    # (URDF, controllers) is set at the top of that launch file. Not together with moveit_demo.

scene:                        # rby1_moveit_objects/launch/scene.launch.py (obstacles into the planning scene)
  config: ""                  # obstacles YAML; "": its config/example_scene.yaml

objects:                      # rby1_moveit_objects/launch/objects.launch.py (modules on the robot, fixtures;
  config: ""                  # the gripper is gripper.scene below). A YAML of its config/, <package>/<path>, or a path; "": its config/objects.yaml

camera:                       # rby1_tools/launch/camera.launch.py
  camera: webcam              # webcam, realsense or file
  config: ""                  # settings YAML; "": its config/webcam.yaml or config/realsense.yaml
  source: ""                  # webcam: device (0, /dev/video0); file: image or video path; "": the config's
  intrinsics: ""              # calibration YAML; "": the config's
  mount: ""                   # camera mount YAML; "": its config/camera_mount.yaml

gripper:                      # rby1_tools/launch/gripper.launch.py (the gripper on the hands)
  model: true                 # its model on TF and for RViz. false on an RB-Y1 v1.3: its robot model has the gripper
  scene: false                # its parts in the planning scene (needs the planner or the demo)
  controller: virtual         # virtual (nothing moves), real (the gripper itself, on the UPC; the fingers move at start) or none
  hands: right,left
  mount: ""                   # where it sits on the robot; "": its config/gripper_mount.yaml
  config: ""                  # the controller's settings; "": its config/virtual_gripper.yaml or gripper_driver.yaml
