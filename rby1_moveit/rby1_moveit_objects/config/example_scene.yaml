# Example obstacles for `ros2 run rby1_moveit_objects scene load <this file>`, or all at once:
#   ros2 launch rby1_moveit_objects scene.launch.py [config:=/path/to/your.yaml]
# Poses are in `frame` (default: base), metres and radians.
objects:
  - name: table
    type: box
    xyz: [0.7, 0.0, 0.35]
    size: [0.6, 1.2, 0.7]
  - name: post
    type: cylinder
    xyz: [0.5, -0.5, 0.9]
    radius: 0.04
    height: 0.6
  - name: ball
    type: sphere
    xyz: [0.45, 0.35, 1.0]
    radius: 0.06
