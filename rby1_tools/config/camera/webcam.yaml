# camera_publisher: a webcam through OpenCV, or an image/video file (camera.launch.py camera:=webcam).
# Topics and frames follow camera_name (launch argument): the image on /<camera_name>/rgb/raw
# (compressed: /<camera_name>/rgb/compressed), its CameraInfo on /<camera_name>/rgb/info, in
# <camera_name>_optical_frame. The mount is the launch argument mount.
/**:
  ros__parameters:
    source: "0"                      # device index or /dev/videoN; or an image (published over and over) or a video (looped)
    width: 1280                      # asked of the camera; the node uses what it gives
    height: 720
    fps: 30.0
    auto_exposure: true
    exposure: 100.0                  # when auto_exposure is false, in the camera driver's units (V4L2: 100 us)
    compressed: false                # true: the image as JPEG on .../rgb/compressed only, not raw (for other PCs)
    intrinsics_file: ""              # a calibration in config/camera/intrinsics/ (or an absolute path); "": none
    horizontal_fov: 69.0             # deg, the pinhole guess without a calibration
